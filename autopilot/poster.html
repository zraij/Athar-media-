<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2)}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2)}
@font-face{font-family:CairoL;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2)}
@font-face{font-family:CairoL;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2)}
@font-face{font-family:CairoL;font-weight:900;src:url(fonts/cairo-latin-900-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2)}
@font-face{font-family:Naskh;font-weight:700;src:url(fonts/naskh-700.woff2)}
:root{--bg1:#0A1030;--bg2:#1D2D72;--ink:#F5F2EA;--muted:#AEB8DD;--acc:#F7B731;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
html,body{margin:0;width:1080px;height:1350px;overflow:clip;background:var(--bg1);font-family:Cairo,CairoL,sans-serif;color:var(--ink)}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(1000px 1000px at 70% 20%,var(--bg2),var(--bg1) 72%)}
#dots{inset:0;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.8px);background-size:44px 44px}
#glow{width:820px;height:820px;border-radius:50%;left:130px;top:330px;background:radial-gradient(circle,rgba(247,183,49,.14),transparent 65%)}
#grain{inset:0;opacity:.08;mix-blend-mode:overlay;background-size:1080px 1350px}
#vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
.tag{top:40px;left:50%;transform:translateX(-50%);padding:8px 30px;border:2px solid var(--line);border-radius:60px;font:800 34px Cairo;background:rgba(255,255,255,.05);white-space:nowrap}
.tag b{color:var(--acc)}
#kick{top:140px;left:60px;right:60px;text-align:center;font:800 46px/1.3 Cairo;color:var(--muted)}
#title{top:205px;left:50px;right:50px;text-align:center;font:900 100px/1.25 Cairo,CairoL}
.acc{color:var(--acc)}
#ill{left:240px;top:520px;width:600px;height:360px}
#sub{top:915px;left:60px;right:60px;text-align:center;font:800 46px/1.35 Cairo,CairoL}
#chips{top:1010px;left:30px;right:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 22px;border-radius:22px;background:var(--card);border:2px solid var(--line);font:800 34px Cairo,CairoL;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--acc);display:inline-block}
#list{left:80px;right:80px;display:flex;flex-direction:column;gap:20px}
.it{display:flex;align-items:center;gap:28px;padding:18px 34px;border-radius:30px;background:var(--card);border:2px solid var(--line);font:800 44px/1.3 Cairo,CairoL}
.it b{flex:none;width:80px;height:80px;border-radius:50%;background:#2a3570;color:var(--acc);display:flex;align-items:center;justify-content:center;font:900 46px CairoL}
#phone{left:200px;right:200px;top:1190px;height:110px;border-radius:55px;background:var(--acc);color:#0A1030;display:flex;align-items:center;justify-content:center;gap:20px;font:900 62px CairoL,Cairo;box-shadow:0 20px 60px rgba(247,183,49,.3)}
#phone.ask{font:900 52px Cairo}
.scr{position:absolute;inset:0;border-radius:30px;border:12px solid #2a3570;box-sizing:border-box;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}
</style></head><body>
<div id="bg" class="abs"></div><div id="dots" class="abs"></div><div id="glow" class="abs"></div>
<div class="tag abs"><b>أثر</b> أكاديمي</div>
<div id="kick" class="abs"></div><div id="title" class="abs"></div>
<div id="ill" class="abs"></div><div id="sub" class="abs"></div><div id="chips" class="abs"></div><div id="list" class="abs"></div>
<div id="phone" class="abs"></div>
<div id="grain" class="abs"></div><div id="vig" class="abs"></div>
<script>
const $=id=>document.getElementById(id);
const P=window.POST||{kicker:'مثال',title:'عنوان *مميز*',sub:'سطر توضيحي',bullets:['نقطة','نقطة'],illus:'atom'};
const acc=s=>s.replace(/\*(.+?)\*/g,'<span class="acc">$1</span>').replace(/\n/g,'<br>');
$('kick').innerHTML=acc(P.kicker||'');$('title').innerHTML=acc(P.title);
const PH='<svg width="54" height="54" viewBox="0 0 24 24"><path fill="#0A1030" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
if(P.ask){$('phone').classList.add('ask');$('phone').textContent=P.ask}else $('phone').innerHTML=PH+'<span dir="ltr">07746451098</span>';
const ILL={
atom:()=>`<div class="scr" style="background:radial-gradient(circle,#24347f,#101740)"><svg width="576" height="336" viewBox="-380 -222 760 444"><g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="7"><ellipse rx="300" ry="96"/><ellipse rx="300" ry="96" transform="rotate(60)"/><ellipse rx="300" ry="96" transform="rotate(120)"/></g><circle cx="290" cy="20" r="22" fill="#F5F2EA"/><circle cx="-60" cy="-190" r="22" fill="#F5F2EA"/><circle cx="-120" cy="150" r="22" fill="#F5F2EA"/><circle r="58" fill="#F7B731"/></svg></div>`,
wave:()=>`<div class="scr" style="background:radial-gradient(circle,#24347f,#101740)"><svg width="576" height="336" viewBox="0 0 576 336"><line x1="40" y1="168" x2="536" y2="168" stroke="rgba(255,255,255,.25)" stroke-width="4"/><path d="M40 168 C 100 40, 160 40, 220 168 S 340 296, 400 168 S 500 60, 536 120" fill="none" stroke="#F7B731" stroke-width="12" stroke-linecap="round"/><circle cx="220" cy="168" r="16" fill="#F5F2EA"/><circle cx="400" cy="168" r="16" fill="#F5F2EA"/></svg></div>`,
cell:()=>`<div class="scr" style="background:radial-gradient(circle,#24347f,#101740)"><svg width="576" height="336" viewBox="0 0 576 336"><ellipse cx="288" cy="168" rx="220" ry="130" fill="rgba(174,184,221,.15)" stroke="rgba(255,255,255,.5)" stroke-width="8"/><circle cx="300" cy="160" r="56" fill="#F7B731"/><circle cx="312" cy="150" r="18" fill="#c98a10"/><ellipse cx="160" cy="120" rx="40" ry="18" fill="#F5F2EA" opacity=".8"/><ellipse cx="420" cy="220" rx="44" ry="18" fill="#F5F2EA" opacity=".8"/><circle cx="180" cy="230" r="14" fill="#F5F2EA"/><circle cx="430" cy="110" r="12" fill="#F5F2EA"/></svg></div>`,
letter:()=>`<div class="scr" style="background:linear-gradient(160deg,#FFF8E8,#F3E7C9)"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 230px/1 Naskh;color:#1D2D72">${P.glyph||'بَ'}</div><svg style="position:absolute;bottom:20px;left:26px" width="110" height="80" viewBox="0 0 120 90"><path d="M10 32h18l24-20v66L28 58H10z" fill="#1D2D72"/><path d="M66 30q12 15 0 30M80 20q22 25 0 50M94 10q32 35 0 70" stroke="#F7B731" stroke-width="7" fill="none" stroke-linecap="round"/></svg><div style="position:absolute;left:330px;top:210px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.6);border:6px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.3)"></div></div>`,
latin:()=>`<div class="scr" style="background:linear-gradient(160deg,#FFF8E8,#F3E7C9)"><div dir="ltr" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 200px/1 CairoL;color:#1D2D72">A<span style="color:#E09A0E">a</span></div><svg style="position:absolute;bottom:20px;left:26px" width="110" height="80" viewBox="0 0 120 90"><path d="M10 32h18l24-20v66L28 58H10z" fill="#1D2D72"/><path d="M66 30q12 15 0 30M80 20q22 25 0 50M94 10q32 35 0 70" stroke="#F7B731" stroke-width="7" fill="none" stroke-linecap="round"/></svg></div>`,
book:()=>`<div style="position:absolute;left:170px;top:0;width:260px;height:350px"><div style="position:absolute;inset:0;border-radius:12px;background:#e9e4d6;transform:translate(-24px,18px) rotate(-4deg)"></div><div style="position:absolute;inset:0;border-radius:12px;background:#e9e4d6;transform:translate(-12px,9px) rotate(-2deg)"></div><div style="position:absolute;inset:0;border-radius:12px;background:linear-gradient(165deg,#1D2D72,#0E1748);border:3px solid rgba(255,255,255,.15);box-shadow:0 30px 70px rgba(0,0,0,.5);overflow:hidden"><div style="height:10px;background:#F7B731"></div><div style="margin:26px auto 0;width:84px;height:84px;border-radius:50%;border:4px dashed rgba(247,183,49,.85);display:flex;align-items:center;justify-content:center;font:800 18px/1.2 Cairo;color:#F7B731;text-align:center">شعار<br>مدرستك</div><div style="text-align:center;margin-top:18px;font:900 26px Cairo">${P.school||'اسم مدرستك'}</div><div style="text-align:center;margin-top:20px;font:900 44px Cairo;color:#F7B731">${P.subject||'الكيمياء'}</div><div style="text-align:center;font:700 22px Tajawal;color:#AEB8DD">${P.grade||'السادس العلمي'}</div></div></div>`,
slide:()=>`<div class="scr" style="background:linear-gradient(150deg,#1D2D72,#0A1030)"><div style="position:absolute;top:22px;right:30px;font:900 38px Cairo;color:#F7B731">نتائج الدراسة</div><div style="position:absolute;top:28px;left:30px;font:700 20px Tajawal;color:rgba(174,184,221,.7);border:2px solid rgba(174,184,221,.35);border-radius:10px;padding:0 10px">مثال</div><div style="position:absolute;bottom:50px;left:40px;width:300px;height:3px;background:rgba(255,255,255,.3)"></div>${[110,160,135,240].map((h,i)=>`<div style="position:absolute;bottom:53px;left:${55+i*72}px;width:52px;height:${h}px;border-radius:8px 8px 3px 3px;background:${i==3?'#F7B731':'#3b4a95'}"></div>`).join('')}<div style="position:absolute;right:40px;top:120px;text-align:center"><div dir="ltr" style="font:900 100px/1 CairoL;color:#F7B731">87%</div><div style="font:700 26px Tajawal;color:#AEB8DD">نسبة التحسّن</div></div></div>`,
question:()=>`<div style="position:absolute;left:150px;top:0;width:300px;height:340px;display:flex;align-items:center;justify-content:center;font:900 330px/1 Cairo;color:#F7B731;text-shadow:0 20px 60px rgba(247,183,49,.35)">؟</div>`,
versus:()=>`<div style="position:absolute;inset:0;display:flex;gap:30px;align-items:center;justify-content:center"><div style="width:270px;height:200px;border-radius:20px;border:10px solid #3a4152;background:radial-gradient(circle at 40% 40%,#2f4a3c,#1d3128)"></div><div style="font:900 70px Cairo;color:#AEB8DD">أو</div><div style="width:270px;height:200px;border-radius:20px;border:10px solid #2a3570;background:radial-gradient(circle,#24347f,#101740);display:flex;align-items:center;justify-content:center"><div style="width:60px;height:60px;border-radius:50%;background:#F7B731"></div></div></div>`
};
if(P.illus==='list'){
  $('ill').remove();$('sub').remove();$('chips').remove();
  const L=$('list');L.style.top=(P.listTop||520)+'px';
  L.innerHTML=P.bullets.map((b,i)=>`<div class="it"><b>${i+1}</b><span>${b}</span></div>`).join('');
}else{
  $('list').remove();$('ill').innerHTML=ILL[P.illus]();
  $('sub').innerHTML=acc(P.sub||'');
  $('chips').innerHTML=(P.bullets||[]).map(b=>`<span class="chip"><i></i>${b}</span>`).join('');
}
let seed=12345;const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
const c=document.createElement('canvas');c.width=540;c.height=675;const x=c.getContext('2d'),im=x.createImageData(540,675);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);$('grain').style.backgroundImage=`url(${c.toDataURL()})`;
Promise.all(['900 10px Cairo','800 10px Cairo','700 10px Tajawal','900 10px CairoL','800 10px CairoL','700 10px Naskh'].map(f=>document.fonts.load(f,'أب Aa 07'))).then(()=>document.fonts.ready).then(()=>{window.ready=true});
</script></body></html>
