book(){$('scr').style.background='radial-gradient(circle at 50% 50%,#24347f,#101740)';ILL.innerHTML=`<div id="bk" style="position:absolute;left:300px;top:40px;width:270px;height:470px">${[3,2,1].map(i=>`<div id="pg${i}" style="position:absolute;inset:0;border-radius:12px;background:#e9e4d6"></div>`).join('')}<div style="position:absolute;inset:0;border-radius:12px;background:linear-gradient(165deg,#1D2D72,#0E1748);border:3px solid rgba(255,255,255,.18);box-shadow:0 30px 70px rgba(0,0,0,.5);overflow:hidden"><div style="height:10px;background:#F7B731"></div><div style="margin:30px auto 0;width:96px;height:96px;border-radius:50%;border:4px dashed rgba(247,183,49,.85);display:flex;align-items:center;justify-content:center;font:800 20px/1.2 Cairo;color:#F7B731;text-align:center">شعار<br>مدرستك</div><div style="text-align:center;margin-top:22px;font:900 28px Cairo">${D.school||'اسم مدرستك'}</div><div style="text-align:center;margin-top:30px;font:900 50px Cairo;color:#F7B731">${D.subject||'الكيمياء'}</div><div style="text-align:center;font:700 26px Tajawal;color:#AEB8DD">${D.grade||'السادس العلمي'}</div></div></div><div id="stp" style="position:absolute;left:60px;top:400px;padding:6px 26px;border-radius:14px;border:6px solid #F7B731;color:#F7B731;font:900 46px Cairo;background:rgba(10,16,48,.6)">جاهزة للطباعة</div>`;

};
